name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          # Writes a settings.xml with a <server id=central> whose credentials
          # are ${env.MAVEN_USERNAME} / ${env.MAVEN_PASSWORD} placeholders.
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.PGP_SECRET }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Cheap, so a mistyped tag fails here and not after the test suite.
      - name: Check tag matches pom version
        run: |
          pom=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "${GITHUB_REF_NAME#v}" != "$pom" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pom version ${pom}"
            exit 1
          fi

      # Tests run here too: ubuntu-latest has Docker, so Testcontainers works.
      - name: Publish to Sonatype Central
        run: mvn -B -Prelease deploy
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

  create-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
